<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>词义配对冲刺</title>
  <style>
    :root { --night:#111827; --panel:#1f2937; --line:#374151; --text:#f9fafb; --muted:#9ca3af; --cyan:#22d3ee; --yellow:#fbbf24; --red:#fb7185; --green:#34d399; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif; color:var(--text); background:radial-gradient(circle at 50% -20%,#164e63 0,transparent 42%),var(--night); }
    button,select { font:inherit; }
    .shell { width:min(900px,100%); margin:auto; padding:20px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(25px,5vw,42px); letter-spacing:-.04em; }
    .kicker { color:var(--cyan); font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    .back { color:var(--cyan); text-decoration:none; font-weight:700; white-space:nowrap; }
    .hud { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
    .hud-item { padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:rgba(31,41,55,.82); }
    .hud-item strong { display:block; font-size:22px; }
    .hud-item span { color:var(--muted); font-size:11px; }
    .timer { height:8px; overflow:hidden; border-radius:10px; background:#374151; margin-bottom:16px; }
    .timer span { display:block; height:100%; width:100%; background:var(--cyan); transition:width .1s linear,background .2s; }
    .arena { min-height:490px; padding:clamp(18px,4vw,34px); border:1px solid var(--line); border-radius:24px; background:rgba(31,41,55,.9); box-shadow:0 24px 70px rgba(0,0,0,.28); }
    .setup,.game-over { min-height:420px; display:grid; place-content:center; text-align:center; gap:16px; }
    .setup p,.game-over p { max-width:520px; margin:0 auto; color:var(--muted); line-height:1.7; }
    select { padding:12px; border:1px solid var(--line); border-radius:12px; color:var(--text); background:var(--night); }
    .primary { padding:13px 24px; border:0; border-radius:13px; background:var(--cyan); color:#083344; font-weight:850; cursor:pointer; }
    .primary:hover { filter:brightness(1.08); transform:translateY(-1px); }
    .round-head { display:flex; justify-content:space-between; gap:16px; color:var(--muted); font-size:13px; margin-bottom:20px; }
    .columns { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .column { display:grid; gap:10px; align-content:start; }
    .column-title { margin:0 0 2px; color:var(--muted); font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
    .tile { min-height:67px; padding:12px 16px; border:1px solid var(--line); border-radius:14px; color:var(--text); background:#111827; text-align:left; cursor:pointer; transition:.14s ease; }
    .tile:hover:not(:disabled) { border-color:var(--cyan); transform:translateY(-2px); }
    .tile.selected { border-color:var(--yellow); background:#422006; box-shadow:0 0 0 2px rgba(251,191,36,.2); }
    .tile.matched { opacity:.18; transform:scale(.97); cursor:default; }
    .tile.wrong { border-color:var(--red); background:#4c0519; animation:shake .24s; }
    .definition { font-size:14px; line-height:1.35; }
    .toast { min-height:30px; margin-top:18px; text-align:center; font-weight:750; }
    .toast.good { color:var(--green); }.toast.bad { color:var(--red); }
    .hidden { display:none!important; }
    @keyframes shake { 25%{transform:translateX(-5px)}75%{transform:translateX(5px)} }
    @media(max-width:620px){.shell{padding:14px}.hud{grid-template-columns:1fr 1fr}.columns{gap:10px}.tile{min-height:76px;padding:10px;font-size:14px}.arena{padding:16px}.definition{font-size:12px}header{align-items:flex-start}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div><div class="kicker">Vocabulary arcade</div><h1>词义配对冲刺</h1></div><a class="back" href="../index.html">返回单词卡</a></header>
    <section class="hud" aria-label="游戏状态">
      <div class="hud-item"><strong id="score">0</strong><span>得分</span></div>
      <div class="hud-item"><strong id="combo">×0</strong><span>连击</span></div>
      <div class="hud-item"><strong id="lives">♥ ♥ ♥</strong><span>生命</span></div>
      <div class="hud-item"><strong id="level">1</strong><span>关卡</span></div>
    </section>
    <div class="timer"><span id="timerBar"></span></div>
    <main class="arena">
      <section class="setup" id="setup">
        <div><div class="kicker">60 秒挑战</div><h2>找出正确的单词与释义</h2></div>
        <p>依次点击左侧英文和右侧中文完成配对。连续答对可获得更高分，配错会失去一颗生命。</p>
        <select id="unitSelect" aria-label="选择词汇范围"><option value="all">全部单元</option></select>
        <button class="primary" id="startBtn" type="button">开始游戏</button>
      </section>
      <section id="game" class="hidden">
        <div class="round-head"><span id="roundLabel">第 1 组</span><span>每组配对 5 个单词</span></div>
        <div class="columns">
          <div class="column"><h2 class="column-title">英文单词</h2><div class="column" id="words"></div></div>
          <div class="column"><h2 class="column-title">中文释义</h2><div class="column" id="definitions"></div></div>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </section>
      <section class="game-over hidden" id="gameOver">
        <div><div class="kicker">游戏结束</div><h2 id="finalTitle">本轮得分 0</h2></div>
        <p id="finalText"></p>
        <button class="primary" id="againBtn" type="button">再来一局</button>
      </section>
    </main>
  </div>
  <script>
    const $=id=>document.getElementById(id);
    const state={lists:[],pool:[],round:[],selectedWord:null,selectedDefinition:null,matched:0,score:0,combo:0,lives:3,level:1,roundNo:0,time:60,timer:null,running:false};

    function parseWords(text){
      const lists=[];let current=null;
      for(let raw of text.replace(/\r/g,'').split('\n')){
        const line=raw.trim(),unit=line.match(/^Word List\s*0?(\d+)/i);
        if(unit){if(current)lists.push(current);current={name:`Word List ${unit[1].padStart(2,'0')}`,words:[]};continue;}
        if(!current||!line)continue;
        const match=line.match(/^(.+?)\s+(?:\/[^/]+\/|\[[^\]]+\]|\{[^}]+\})(?:\s*;\s*(?:\/[^/]+\/|\[[^\]]+\]|\{[^}]+\}))*\s+(.+)$/);
        if(!match)continue;
        const word=match[1].replace(/\*$/,'').trim();
        const definition=match[2].replace(/^(?:n|v|vt|vi|a|ad|adv|prep|conj|pron|num|excl|int)\.(?:\/(?:n|v|vt|vi|a|ad|adv)\.)*\s*/i,'');
        if(word&&!current.words.some(item=>item.word===word))current.words.push({id:`${lists.length}-${current.words.length}`,word,definition});
      }
      if(current)lists.push(current);return lists.filter(list=>list.words.length>=5);
    }
    function shuffle(items){const a=[...items];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function start(){
      const choice=$('unitSelect').value;
      state.pool=choice==='all'?state.lists.flatMap(x=>x.words):state.lists[Number(choice)].words;
      Object.assign(state,{selectedWord:null,selectedDefinition:null,matched:0,score:0,combo:0,lives:3,level:1,roundNo:0,time:60,running:true});
      $('setup').classList.add('hidden');$('gameOver').classList.add('hidden');$('game').classList.remove('hidden');
      clearInterval(state.timer);state.timer=setInterval(tick,100);nextRound();renderHud();
    }
    function tick(){state.time=Math.max(0,state.time-.1);$('timerBar').style.width=`${state.time/60*100}%`;$('timerBar').style.background=state.time<10?'var(--red)':'var(--cyan)';if(state.time<=0)finish('时间到！');}
    function nextRound(){
      state.roundNo++;state.matched=0;state.selectedWord=null;state.selectedDefinition=null;
      state.round=shuffle(state.pool).slice(0,5).map((item,index)=>({...item,pair:String(index)}));
      $('roundLabel').textContent=`第 ${state.roundNo} 组`;$('toast').textContent='';
      renderTiles('words',shuffle(state.round),'word');renderTiles('definitions',shuffle(state.round),'definition');
    }
    function renderTiles(target,items,type){
      $(target).innerHTML='';items.forEach(item=>{const button=document.createElement('button');button.type='button';button.className=`tile ${type==='definition'?'definition':''}`;button.textContent=item[type];button.dataset.pair=item.pair;button.addEventListener('click',()=>select(button,type));$(target).appendChild(button);});
    }
    function select(button,type){
      if(!state.running||button.classList.contains('matched'))return;
      const key=type==='word'?'selectedWord':'selectedDefinition';
      const prior=state[key];if(prior)prior.classList.remove('selected');state[key]=button;button.classList.add('selected');
      if(state.selectedWord&&state.selectedDefinition)checkPair();
    }
    function checkPair(){
      const word=state.selectedWord,definition=state.selectedDefinition;state.selectedWord=null;state.selectedDefinition=null;
      if(word.dataset.pair===definition.dataset.pair){
        word.classList.replace('selected','matched');definition.classList.replace('selected','matched');state.matched++;state.combo++;state.score+=100+Math.min(state.combo,10)*10;
        showToast(`正确！连击 ×${state.combo}`,'good');
        if(state.matched===state.round.length){state.level++;state.time=Math.min(60,state.time+4);setTimeout(()=>state.running&&nextRound(),550);}
      }else{
        state.combo=0;state.lives--;word.classList.add('wrong');definition.classList.add('wrong');showToast('配对错误，失去一颗生命','bad');
        setTimeout(()=>{word.classList.remove('selected','wrong');definition.classList.remove('selected','wrong');},350);
        if(state.lives<=0)setTimeout(()=>finish('生命用尽'),380);
      }renderHud();
    }
    function showToast(text,type){$('toast').textContent=text;$('toast').className=`toast ${type}`;}
    function renderHud(){$('score').textContent=state.score;$('combo').textContent=`×${state.combo}`;$('lives').textContent='♥ '.repeat(state.lives).trim()||'—';$('level').textContent=state.level;}
    function finish(reason){if(!state.running)return;state.running=false;clearInterval(state.timer);$('game').classList.add('hidden');$('gameOver').classList.remove('hidden');$('finalTitle').textContent=`${reason} · ${state.score} 分`;$('finalText').textContent=`完成 ${state.roundNo-1} 组，最高连击会让每次正确配对获得更多奖励。`;saveHighScore();}
    function saveHighScore(){try{const best=Math.max(state.score,Number(localStorage.getItem('ielts-match-best-v1'))||0);localStorage.setItem('ielts-match-best-v1',String(best));$('finalText').textContent+=` 本机最高分：${best}。`;}catch{}}

    fetch('../word-list.txt').then(r=>{if(!r.ok)throw Error();return r.text();}).then(text=>{state.lists=parseWords(text);state.lists.forEach((list,index)=>$('unitSelect').add(new Option(`${list.name} · ${list.words.length} 词`,index)));}).catch(()=>{$('startBtn').disabled=true;$('startBtn').textContent='词库加载失败';});
    $('startBtn').addEventListener('click',start);$('againBtn').addEventListener('click',()=>{$('gameOver').classList.add('hidden');$('setup').classList.remove('hidden');});
  </script>
</body>
</html>
