<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CEFR 英语水平测试</title>
  <style>
    :root{--ink:#18231d;--muted:#69756d;--paper:#f4f1e8;--card:#fffdf8;--green:#176b45;--deep:#0e4d32;--pale:#dcecdf;--line:#d8d3c7;--red:#a53d32;--gold:#b47819}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#e1eddc 0,transparent 28%),var(--paper)}
    button{font:inherit;cursor:pointer}.shell{width:min(880px,100%);margin:auto;padding:28px 20px 48px}.top{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:28px}.eyebrow{color:var(--green);font-weight:750;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.top h1{font:700 clamp(28px,6vw,46px)/1.08 Georgia,serif;margin:8px 0 10px}.top p{color:var(--muted);margin:0;max-width:580px;line-height:1.7}.back{color:var(--green);text-decoration:none;font-weight:700;white-space:nowrap}.panel{background:rgba(255,253,248,.9);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 55px rgba(51,59,51,.1);padding:clamp(24px,6vw,58px)}
    .intro-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:34px;align-items:center}.intro h2{font:700 30px Georgia,serif;margin:0 0 14px}.intro p{line-height:1.8;color:var(--muted)}.facts{display:grid;gap:10px}.fact{padding:15px 17px;border:1px solid var(--line);border-radius:16px;background:#faf8f0}.fact strong{display:block;font-size:20px;color:var(--green)}.fact span{font-size:13px;color:var(--muted)}.primary{border:0;border-radius:14px;padding:13px 21px;background:var(--green);color:#fff;font-weight:750}.primary:hover{background:var(--deep)}.ghost{border:1px solid var(--line);border-radius:14px;padding:12px 18px;background:transparent;color:var(--ink);font-weight:700}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px}.hidden{display:none!important}
    .quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:14px}.bar{height:8px;background:#e2dfd5;border-radius:9px;overflow:hidden;margin-bottom:36px}.bar span{display:block;height:100%;width:0;background:var(--green);transition:width .3s}.tag{display:inline-block;padding:6px 10px;border-radius:99px;background:var(--pale);color:var(--green);font-size:12px;font-weight:750}.question{font:700 clamp(24px,5vw,34px)/1.35 Georgia,serif;margin:16px 0 25px}.options{display:grid;gap:12px}.option{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);transition:.15s}.option:hover,.option:focus-visible{border-color:var(--green);background:#f7fbf6}.option .letter{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#f0eee7;font-weight:800;color:var(--muted);flex:none}.option.selected{border-color:var(--green);background:var(--pale)}.option.selected .letter{background:var(--green);color:#fff}.feedback{min-height:24px;margin-top:18px;font-weight:650}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}
    .result{text-align:center}.result h2{font:700 34px Georgia,serif;margin:8px 0}.level{font-size:72px;line-height:1;color:var(--green);font-weight:800;margin:16px 0 8px}.score{color:var(--muted)}.result-note{max-width:590px;margin:24px auto;line-height:1.8;color:var(--muted)}.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left;margin:28px 0}.skill{padding:15px;border:1px solid var(--line);border-radius:15px}.skill-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.skill small{display:block;color:var(--muted);margin-top:5px}.meter{height:6px;background:#e5e1d8;border-radius:5px;margin-top:12px;overflow:hidden}.meter i{display:block;height:100%;background:var(--green);border-radius:5px}.history{font-size:13px;color:var(--muted);margin-top:22px}.result .actions{justify-content:center}
    @media(max-width:650px){.shell{padding:20px 14px 35px}.top{margin-bottom:20px}.intro-grid{grid-template-columns:1fr;gap:20px}.panel{border-radius:21px;padding:24px 20px}.breakdown{grid-template-columns:1fr}.question{font-size:25px}.actions{align-items:stretch;flex-direction:column-reverse}.actions button{width:100%}.top .back{font-size:13px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><div><div class="eyebrow">English placement</div><h1>CEFR 英语水平测试</h1><p>用约 5 分钟了解你的英语阅读与语法水平，结果对应欧洲语言共同参考框架（CEFR）。</p></div><a class="back" href="../index.html">返回首页</a></header>
    <main id="intro" class="panel intro-grid"><section class="intro"><h2>准备好测一下了吗？</h2><p>共 15 道单选题，题目从基础到进阶。请根据第一反应作答，不必使用词典。这个测试用于快速自测，不等同于官方考试成绩。</p><button class="primary" id="startBtn" type="button">开始测试</button></section><section class="facts"><div class="fact"><strong>15</strong><span>道精选题目</span></div><div class="fact"><strong>A1 – C1</strong><span>覆盖五个 CEFR 等级</span></div><div class="fact"><strong>即时</strong><span>查看结果与能力画像</span></div></section></main>
    <main id="quiz" class="panel hidden"><div class="quiz-head"><span id="counter">第 1 / 15 题</span><span class="tag" id="difficulty">基础</span></div><div class="bar"><span id="progress"></span></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="ghost" id="quitBtn" type="button">退出测试</button><button class="primary" id="nextBtn" type="button" disabled>下一题</button></div></main>
    <main id="result" class="panel result hidden"><div class="eyebrow">Your result</div><h2>你的 CEFR 估测等级</h2><div class="level" id="level">B1</div><div class="score" id="score"></div><p class="result-note" id="note"></p><div class="breakdown" id="breakdown"></div><div class="history" id="history"></div><div class="actions"><button class="ghost" id="reviewBtn" type="button">重新测试</button><button class="primary" id="shareBtn" type="button">复制结果</button></div></main>
  </div>
  <script>
    const questions=[
      {level:'A1',skill:'语法',q:'My sister ___ a student.',a:['am','is','are','be'],correct:1},
      {level:'A1',skill:'词汇',q:'What do you usually do ___ the weekend?',a:['in','at','on','to'],correct:2},
      {level:'A1',skill:'阅读',q:'“The shop is closed today.” What does this mean?',a:['The shop is open.','You cannot shop there today.','The shop is very busy.','The shop moved today.'],correct:1},
      {level:'A2',skill:'语法',q:'I ___ to London three times.',a:['have been','was','am going','go'],correct:0},
      {level:'A2',skill:'词汇',q:'Could you ___ me a hand with this box?',a:['give','make','take','do'],correct:0},
      {level:'A2',skill:'阅读',q:'“Please leave your keys at reception before departure.” What should you do?',a:['Take the keys home.','Give the keys to reception.','Leave reception early.','Ask for a new room.'],correct:1},
      {level:'B1',skill:'语法',q:'If I ___ more free time, I would learn another language.',a:['have','had','will have','would have'],correct:1},
      {level:'B1',skill:'词汇',q:'The meeting was ___ because the manager was ill.',a:['put off','put out','put up','put in'],correct:0},
      {level:'B1',skill:'阅读',q:'“Despite the heavy traffic, Maya arrived on time.” What can we infer?',a:['Maya was late.','There was no traffic.','Traffic did not prevent Maya being punctual.','Maya cancelled the meeting.'],correct:2},
      {level:'B2',skill:'语法',q:'By the time we arrived, the film ___.',a:['already started','has already started','had already started','was already starting'],correct:2},
      {level:'B2',skill:'词汇',q:'The report provides ___ evidence that the policy is effective.',a:['compelling','compelled','compulsion','compel'],correct:0},
      {level:'B2',skill:'阅读',q:'“The proposal is feasible, although its implementation may prove costly.” What does the writer mean?',a:['It is impossible.','It can work, but may be expensive to put into practice.','It is cheap and easy.','It has already been implemented.'],correct:1},
      {level:'C1',skill:'语法',q:'Rarely ___ such a thorough analysis of the issue.',a:['we see','do we see','we do see','see we'],correct:1},
      {level:'C1',skill:'词汇',q:'Her argument is persuasive, but it rests on a rather ___ assumption.',a:['tenuous','tenacity','tenure','tentative'],correct:0},
      {level:'C1',skill:'阅读',q:'“The findings call into question the assumption that economic growth inevitably improves wellbeing.” Which view do the findings challenge?',a:['Growth always improves wellbeing.','Wellbeing can be measured.','The economy is difficult to study.','Findings require more research.'],correct:0}
    ];
    const state={index:0,answers:[],selected:null}; const $=id=>document.getElementById(id);
    function show(id){['intro','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
    function start(){state.index=0;state.answers=[];state.selected=null;show('quiz');render();}
    function render(){const item=questions[state.index];$('counter').textContent=`第 ${state.index+1} / ${questions.length} 题`;$('difficulty').textContent=item.level+' · '+item.skill;$('progress').style.width=`${state.index/questions.length*100}%`;$('question').textContent=item.q;$('feedback').textContent='';$('feedback').className='feedback';$('nextBtn').disabled=true;$('nextBtn').textContent=state.index===questions.length-1?'查看结果':'下一题';const letters=['A','B','C','D'];$('options').innerHTML=item.a.map((x,i)=>`<button class="option" type="button" data-index="${i}"><span class="letter">${letters[i]}</span><span>${x}</span></button>`).join('');document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>select(Number(btn.dataset.index))));}
    function select(index){if(state.selected!==null)return;state.selected=index;const item=questions[state.index];document.querySelectorAll('.option')[index].classList.add('selected');const right=index===item.correct;$('feedback').textContent=right?'回答正确！':'这题的正确答案是 '+['A','B','C','D'][item.correct]+'。';$('feedback').className='feedback '+(right?'good':'bad');state.answers.push({right,skill:item.skill});$('nextBtn').disabled=false;document.querySelectorAll('.option').forEach(b=>b.disabled=true);}
    function finish(){const total=state.answers.filter(x=>x.right).length;const level=total<=3?'A1':total<=6?'A2':total<=9?'B1':total<=12?'B2':'C1';$('level').textContent=level;$('score').textContent=`${total} / ${questions.length} 题答对`;$('note').textContent={A1:'你已掌握日常英语的起点。建议从高频词汇、基本句型和简单对话开始。',A2:'你能处理熟悉场景中的基础交流。建议扩大词汇量并练习过去时、完成时等核心语法。',B1:'你可以应对大多数日常情境并表达观点。建议加强长篇阅读、搭配和复杂句型。',B2:'你具备独立使用英语的能力。建议关注语气、准确度以及正式和非正式表达的切换。',C1:'你展现出高级英语理解能力。建议通过真实语料持续打磨细微语义、风格和表达弹性。'}[level];const skills=['语法','词汇','阅读'];$('breakdown').innerHTML=skills.map(skill=>{const rows=state.answers.filter(x=>x.skill===skill);const n=rows.filter(x=>x.right).length;return `<div class="skill"><div class="skill-top"><span>${skill}</span><span>${n}/${rows.length}</span></div><div class="meter"><i style="width:${n/rows.length*100}%"></i></div><small>${n/rows.length>=.67?'表现较强':n/rows.length>=.34?'还可提升':'建议重点练习'}</small></div>`}).join('');const history=JSON.parse(localStorage.getItem('cefr-history')||'[]');history.unshift({level,total,date:new Date().toLocaleDateString('zh-CN')});localStorage.setItem('cefr-history',JSON.stringify(history.slice(0,5)));$('history').textContent='最近一次：'+history[0].date+' · '+history[0].level+'（本机保存）';show('result');}
    $('startBtn').addEventListener('click',start);$('reviewBtn').addEventListener('click',start);$('quitBtn').addEventListener('click',()=>show('intro'));$('nextBtn').addEventListener('click',()=>{if(state.index===questions.length-1)finish();else{state.index++;state.selected=null;render();}});$('shareBtn').addEventListener('click',async()=>{const text=`我的 CEFR 英语水平测试结果：${$('level').textContent}（${$('score').textContent}）`;try{await navigator.clipboard.writeText(text);$('shareBtn').textContent='已复制';setTimeout(()=>$('shareBtn').textContent='复制结果',1500)}catch{$('shareBtn').textContent='请手动记录结果'}});
  </script>
</body>
</html>
