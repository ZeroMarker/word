<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日一词 · 一词发散</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,0&display=swap" rel="stylesheet">
    <style>
        /* ========================================
           Design Tokens（与主单词卡同风格：Material 3）
           ======================================== */
        :root {
            --md-primary: #6750A4;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #EADDFF;
            --md-on-primary-container: #21005D;

            --md-surface: #FFFBFE;
            --md-on-surface: #1C1B1F;
            --md-surface-variant: #E7E0EC;
            --md-on-surface-variant: #49454F;
            --md-outline: #79747E;
            --md-outline-variant: #CAC4D0;

            --md-elevation-1: 0px 1px 3px 1px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.30);
            --md-elevation-2: 0px 2px 6px 2px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.30);

            /* 词性配色 */
            --pos-n: #6750A4;
            --pos-n-bg: #EADDFF;
            --pos-v: #00696D;
            --pos-v-bg: #C7ECEC;
            --pos-a: #8A5800;
            --pos-a-bg: #FFE2B8;

            --fire: #E07000;
            --green: #176B45;
            --green-bg: #DCEEDF;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #F3EDFA 0%, #FFFBFE 280px);
            color: var(--md-on-surface);
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* ========================================
           Top App Bar
           ======================================== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 60px;
            padding: 0 16px;
            background: rgba(255, 251, 254, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 1px 0 var(--md-outline-variant);
        }

        .topbar .back {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            height: 40px;
            padding: 0 8px 0 4px;
            border-radius: 999px;
            border: none;
            background: transparent;
            color: var(--md-primary);
            font-size: 14px;
            font-weight: 600;
        }

        .topbar .back:hover {
            background: rgba(103, 80, 164, 0.08);
        }

        .topbar .back .material-symbols-outlined {
            font-size: 20px;
        }

        .topbar .title {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0;
        }

        .streak-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 34px;
            padding: 0 14px;
            border-radius: 999px;
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            font-size: 13px;
            font-weight: 600;
        }

        .streak-pill .material-symbols-outlined {
            font-size: 17px;
            color: var(--fire);
        }

        /* ========================================
           主内容
           ======================================== */
        .wrap {
            max-width: 600px;
            margin: 0 auto;
            padding: 18px 16px 40px;
        }

        /* ---- 日期栏 + 词性轮换 ---- */
        .datebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .datebar .date {
            font-size: 15px;
            font-weight: 600;
            color: var(--md-on-surface);
        }

        .datebar .date small {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: var(--md-on-surface-variant);
            margin-top: 2px;
        }

        .rotate {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--md-surface);
            border: 1px solid var(--md-outline-variant);
            border-radius: 999px;
            padding: 5px 8px;
        }

        .rotate .seg {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            color: var(--md-on-surface-variant);
            opacity: 0.5;
            background: transparent;
            border: none;
        }

        .rotate .seg.active {
            color: #fff;
            opacity: 1;
        }

        /* ---- 今日词汇卡 ---- */
        .daily {
            position: relative;
            background: var(--md-surface);
            border-radius: 24px;
            box-shadow: var(--md-elevation-2);
            padding: 30px 26px 26px;
            text-align: center;
            overflow: hidden;
        }

        .daily--speaking::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 0 0 3px var(--md-primary);
            pointer-events: none;
        }

        .pos-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-bottom: 18px;
        }

        .daily .word {
            font-size: 40px;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.01em;
            margin-bottom: 10px;
        }

        .phonetic {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 16px 7px 18px;
            border-radius: 999px;
            border: none;
            background: var(--md-surface-variant);
            color: var(--md-on-surface-variant);
            font-size: 15px;
            font-family: 'Times New Roman', Georgia, serif;
            margin-bottom: 14px;
        }

        .phonetic:hover {
            background: var(--md-outline-variant);
        }

        .phonetic .material-symbols-outlined {
            font-size: 18px;
            font-family: 'Material Symbols Outlined';
        }

        .daily .zh {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.7;
            color: var(--md-on-surface);
            max-width: 420px;
            margin: 0 auto 0;
        }

        /* ---- 打卡 + 日期导航 ---- */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0 26px;
        }

        .checkin-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 999px;
            background: var(--md-primary);
            color: var(--md-on-primary);
            font-size: 15px;
            font-weight: 600;
            box-shadow: var(--md-elevation-1);
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .checkin-btn:active {
            transform: scale(0.98);
        }

        .checkin-btn.done {
            background: var(--green);
        }

        .checkin-btn .material-symbols-outlined {
            font-size: 20px;
        }

        .daynav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .daynav button {
            height: 42px;
            border-radius: 999px;
            border: 1px solid var(--md-outline-variant);
            background: var(--md-surface);
            color: var(--md-on-surface);
            font-size: 13.5px;
            font-weight: 600;
            padding: 0 16px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .daynav button:hover {
            background: var(--md-surface-variant);
        }

        .daynav .today-btn {
            flex: 1;
            justify-content: center;
            border-color: transparent;
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
        }

        .daynav .today-btn:hover {
            background: #DDCCFB;
        }

        .daynav .material-symbols-outlined {
            font-size: 18px;
        }

        /* ---- 小节标题 ---- */
        .section-title {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin: 26px 6px 10px;
        }

        .section-title h2 {
            font-size: 16px;
            font-weight: 700;
        }

        .section-title h2 .dot {
            margin-right: 6px;
        }

        .section-title span.sub {
            font-size: 12.5px;
            color: var(--md-on-surface-variant);
            font-weight: 400;
        }

        /* ---- 一词发散 · 同词性联想导图 ---- */
        .map-wrap {
            position: relative;
            width: 100%;
            background:
                radial-gradient(circle at 50% 50%, rgba(103, 80, 164, 0.06) 0%, rgba(103, 80, 164, 0) 62%);
            border: 1px solid var(--md-outline-variant);
            border-radius: 20px;
            overflow: hidden;
            touch-action: pan-y;
        }

        .map-wrap svg {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .mnode {
            position: absolute;
            transform: translate(-50%, -50%);
            min-width: 76px;
            max-width: 132px;
            padding: 7px 10px 6px;
            border-radius: 14px;
            border: 1px solid var(--md-outline-variant);
            background: var(--md-surface);
            box-shadow: var(--md-elevation-1);
            text-align: center;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, opacity 0.35s ease;
            font-size: 13px;
        }

        .mnode:hover {
            transform: translate(-50%, -50%) translateY(-1px);
            border-color: var(--md-primary);
        }

        .mnode.speaking {
            border-color: var(--md-primary);
            background: var(--md-primary-container);
            transform: translate(-50%, -50%) scale(1.05);
        }

        .mnode .mword {
            display: block;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .mnode .mzh {
            display: block;
            font-size: 10.5px;
            font-weight: 500;
            color: var(--md-on-surface-variant);
            line-height: 1.45;
            margin-top: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .mnode .mp {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.04em;
            padding: 1px 7px;
            border-radius: 999px;
            margin-top: 4px;
            color: #fff;
            background: var(--mp, var(--md-primary));
        }

        /* 中心词节点 */
        .mnode.center {
            min-width: 128px;
            max-width: 150px;
            border: none;
            color: #fff;
            z-index: 2;
            background: var(--mp, var(--md-primary));
            padding: 13px 12px 11px;
        }

        .mnode.center .mword {
            font-size: 16.5px;
            letter-spacing: 0.01em;
        }

        .mnode.center .mzh {
            color: rgba(255, 255, 255, 0.88);
            font-size: 11.5px;
        }

        .mnode.center .mp {
            background: rgba(255, 255, 255, 0.22);
            color: #fff;
        }

        .map-note {
            text-align: center;
            font-size: 11.5px;
            color: var(--md-on-surface-variant);
            margin-top: 8px;
        }

        /* ---- 同义 / 反义词 ---- */
        .pairs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .pair-card {
            background: var(--md-surface);
            border: 1px solid var(--md-outline-variant);
            border-radius: 18px;
            padding: 16px 14px;
        }

        .pair-card h3 {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13.5px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--md-on-surface);
        }

        .pair-card h3 .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .pair-card.syn h3 .dot {
            background: #2E7D32;
        }

        .pair-card.ant h3 .dot {
            background: #C62828;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .chips button {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--md-outline-variant);
            background: #FBF8FC;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--md-on-surface);
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .chips button:hover {
            border-color: var(--md-primary);
            background: var(--md-primary-container);
        }

        .chips button small {
            font-weight: 500;
            color: var(--md-on-surface-variant);
        }

        .pair-card .empty {
            font-size: 12.5px;
            color: var(--md-on-surface-variant);
        }

        /* ---- 例句 ---- */
        .example {
            position: relative;
            background: var(--md-primary-container);
            border-radius: 20px;
            padding: 20px 20px 18px 22px;
            margin-top: 4px;
        }

        .example .quote {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 34px;
            line-height: 1;
            color: rgba(103, 80, 164, 0.28);
            font-family: Georgia, serif;
        }

        .example .cap {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--md-on-primary-container);
            opacity: 0.75;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .example .en {
            font-size: 15.5px;
            font-weight: 600;
            line-height: 1.75;
            color: var(--md-on-primary-container);
            padding-right: 30px;
        }

        .example .zh {
            font-size: 13px;
            line-height: 1.7;
            color: var(--md-on-primary-container);
            opacity: 0.85;
            margin-top: 6px;
        }

        .example .say {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--md-primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--md-elevation-1);
        }

        .example .say .material-symbols-outlined {
            font-size: 20px;
        }

        /* ---- 动画 ---- */
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rise {
            animation: rise 0.45s var(--md-motion-emphasized-decel, cubic-bezier(0.05, 0.7, 0.1, 1)) both;
        }

        .mnode.fade-in {
            animation: fadeIn 0.4s ease both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 420px) {
            .daily {
                padding: 24px 18px 22px;
            }

            .daily .word {
                font-size: 34px;
            }

            .pairs {
                grid-template-columns: 1fr;
            }
        }

        @media (min-width: 640px) {
            .wrap {
                padding-top: 26px;
            }

            .daily .word {
                font-size: 44px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="back" href="../index.html" aria-label="返回单词卡">
            <span class="material-symbols-outlined">arrow_back</span>单词卡
        </a>
        <span class="title">每日一词</span>
        <span class="streak-pill" id="streakPill" title="连续打卡天数">
            <span class="material-symbols-outlined">local_fire_department</span>
            <span id="streakText">0 天</span>
        </span>
    </header>

    <div class="wrap">
        <!-- 日期栏 -->
        <section class="datebar rise">
            <div class="date">
                <span id="dateText">-</span>
                <small id="dateSub">今天 · 词性轮换 名词→动词→形容词</small>
            </div>
            <div class="rotate" id="rotateBar" aria-label="词性轮换">
                <button class="seg" data-pos="n">名词</button>
                <button class="seg" data-pos="v">动词</button>
                <button class="seg" data-pos="a">形容词</button>
            </div>
        </section>

        <!-- 今日词汇 -->
        <section class="daily rise" id="dailyCard" aria-label="今日词汇">
            <span class="pos-badge" id="posBadge">-</span>
            <h1 class="word" id="wordText">-</h1>
            <button class="phonetic" id="phoneticBtn" aria-label="播放发音">
                <span class="material-symbols-outlined">volume_up</span>
                <span id="phoneticText">-</span>
            </button>
            <p class="zh" id="zhText">-</p>
        </section>

        <!-- 打卡 & 日期导航 -->
        <section class="actions rise">
            <button class="checkin-btn" id="checkinBtn" aria-label="打卡">
                <span class="material-symbols-outlined">task_alt</span>
                <span id="checkinText">今日打卡</span>
            </button>
            <div class="daynav">
                <button id="prevDay" aria-label="前一天">
                    <span class="material-symbols-outlined">chevron_left</span>昨天
                </button>
                <button class="today-btn" id="todayBtn">回到今天</button>
                <button id="nextDay" aria-label="后一天">
                    明天<span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>
        </section>

        <!-- 一词发散 · 同词性联想 -->
        <div class="section-title rise">
            <h2><span class="dot">🧩</span>一词发散 · 同词性联想</h2>
            <span class="sub">点击任意词即可朗读</span>
        </div>
        <div class="map-wrap rise" id="mapWrap" aria-label="同词性联想发散图"></div>
        <p class="map-note rise">同一词性发散：动词发散动词、名词发散名词、形容词发散形容词，近义与关联词串起来记。</p>

        <!-- 同义 / 反义词 -->
        <div class="pairs rise">
            <section class="pair-card syn">
                <h3><span class="dot"></span>同义词</h3>
                <div class="chips" id="synChips"></div>
            </section>
            <section class="pair-card ant">
                <h3><span class="dot"></span>反义词</h3>
                <div class="chips" id="antChips"></div>
            </section>
        </div>

        <!-- 例句 -->
        <div class="section-title rise">
            <h2><span class="dot">✍️</span>实用例句</h2>
        </div>
        <figure class="example rise">
            <span class="quote">“</span>
            <div class="cap"><span class="material-symbols-outlined">format_quote</span>语境中学单词</div>
            <p class="en" id="exEn">-</p>
            <figcaption class="zh" id="exZh">-</figcaption>
            <button class="say" id="exSay" aria-label="朗读例句">
                <span class="material-symbols-outlined">volume_up</span>
            </button>
        </figure>
    </div>

    <script>

        // 词库（自含数据，离线可用）

        // rel 同词性发散词 [单词, 释义]（动词发散动词，名词发散名词）
        // s 同义词 [单词, 释义] | a 反义词 [单词, 释义]
        // e 例句 [英文, 中文]
        // ================================================

                ],

              ],

                ]
              ],

                "农业雇用了当地很大一部分人口。"
              ]
            },
            {
              "w": "environment",
              "p": "/ɪnˈvaɪrənmənt/",
              "z": "环境；自然环境",
              "rel": [
                [
                  "surroundings",
                  "周围环境"
                ],
                [
                  "atmosphere",
                  "气氛；大气"
                ],
                [
                  "habitat",
                  "栖息地"
                ],
                [
                  "ecosystem",
                  "生态系统"
                ],
                [
                  "climate",
                  "气候"
                ],
                [

                ]
              ],
              "s": [
                [
                  "surroundings",

                [

        // ================================================
        // 日期与选词逻辑
        // 词性轮换：名词 → 动词 → 形容词（按天循环）
        // 同一天在世界各地看到的词一致
        // ================================================
        const MS_DAY = 86400000;
        const POS_ORDER = ['n', 'v', 'a'];
        const POS_LABEL = { n: '名词 · NOUN', v: '动词 · VERB', a: '形容词 · ADJ' };
        const POS_CN = { n: '名词', v: '动词', a: '形容词' };
        const WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

        function pad2(x) { return String(x).padStart(2, '0'); }
        function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
        function dayNumber(d) { return Math.floor(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / MS_DAY); }
        function shiftDay(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

        let viewOffset = 0; // 相对今天偏移（天）

        function wordForOffset(offset) {
            const d = shiftDay(new Date(), offset);
            const dn = dayNumber(d);
            const pos = POS_ORDER[((dn % 3) + 3) % 3];
            const idx = Math.floor(Math.max(dn, 0) / 3) % SEEDS[pos].length;
            return { seed: SEEDS[pos][idx], pos: pos, date: d };
        }

        // ================================================
        // 打卡 / 连续天数
        // ================================================
        const STORE_KEY = 'daily-word-progress-v1';

        function loadLog() {
            try {
                const raw = JSON.parse(localStorage.getItem(STORE_KEY));
                if (raw && typeof raw === 'object' && raw.m) return raw;
            } catch (e) { /* ignore */ }
            return { m: {} };
        }

        function saveLog(log) {
            try { localStorage.setItem(STORE_KEY, JSON.stringify(log)); } catch (e) { /* ignore */ }
        }

        function computeStreak(log) {
            let n = 0;
            let d = new Date();
            // 今天尚未打卡时，连续天数从昨天往前累加，避免白天打开就显示 0 天
            if (!log.m[dateKey(d)]) d = shiftDay(d, -1);
            while (log.m[dateKey(d)]) { n++; d = shiftDay(d, -1); }
            return n;
        }

        function totalCheckins(log) {
            return Object.keys(log.m).length;
        }

        // ================================================
        // 发音
        // ================================================
        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.85;
            speechSynthesis.speak(u);
        }

        // ================================================
        // DOM
        // ================================================
        const $ = (id) => document.getElementById(id);
        const el = {
            dateText: $('dateText'), dateSub: $('dateSub'),
            rotateBar: $('rotateBar'), segs: [].slice.call($('rotateBar').children),
            posBadge: $('posBadge'), wordText: $('wordText'),
            phoneticBtn: $('phoneticBtn'), phoneticText: $('phoneticText'),
            zhText: $('zhText'),
            dailyCard: $('dailyCard'),
            checkinBtn: $('checkinBtn'), checkinText: $('checkinText'),
            prevDay: $('prevDay'), nextDay: $('nextDay'), todayBtn: $('todayBtn'),
            streakText: $('streakText'), streakPill: $('streakPill'),
            mapWrap: $('mapWrap'), synChips: $('synChips'), antChips: $('antChips'),
            exEn: $('exEn'), exZh: $('exZh'), exSay: $('exSay')
        };

        let current = null; // { seed, pos, date }

        // ================================================
        // 渲染：思维导图
        // ================================================
        function mkNode(word, zh, posLabel, isCenter) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'mnode' + (isCenter ? ' center' : ' fade-in');
            b.dataset.word = word;
            const wSpan = document.createElement('span');
            wSpan.className = 'mword';
            wSpan.textContent = word;
            const zhSpan = document.createElement('span');
            zhSpan.className = 'mzh';
            zhSpan.textContent = zh || '';
            b.appendChild(wSpan);
            if (zh) b.appendChild(zhSpan);
            if (posLabel) {
                const p = document.createElement('span');
                p.className = 'mp';
                p.textContent = posLabel;
                b.appendChild(p);
            }
            if (isCenter) {
                b.style.setProperty('--mp', posColor(current.pos));
            }
            return b;
        }

        function layoutMindMap() {
            const seed = current.seed;
            const fam = seed.rel || [];
            const n = fam.length;
            const wrap = el.mapWrap;
            const w = wrap.clientWidth || 340;
            const idealH = n <= 4 ? 300 : 300 + (n - 4) * 24;
            const h = Math.min(Math.max(idealH, 290), 450);
            wrap.style.height = h + 'px';
            wrap.innerHTML = '';

            const cx = w / 2, cy = h / 2;
            const nodeW = n <= 5 ? 118 : 104;
            const nodeH = n <= 5 ? 50 : 46;
            const r = Math.max(66, Math.min(w / 2 - nodeW / 2 - 14, h / 2 - nodeH / 2 - 14, 145));

            // 连线
            const NS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(NS, 'svg');
            svg.setAttribute('width', w);
            svg.setAttribute('height', h);
            svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
            svg.setAttribute('aria-hidden', 'true');
            for (let i = 0; i < n; i++) {
                const ang = -Math.PI / 2 + (Math.PI * 2 * i) / n;
                const x = cx + r * Math.cos(ang);
                const y = cy + r * Math.sin(ang);
                const line = document.createElementNS(NS, 'line');
                line.setAttribute('x1', cx);
                line.setAttribute('y1', cy);
                line.setAttribute('x2', x);
                line.setAttribute('y2', y);
                line.setAttribute('stroke', getComputedStyle(document.documentElement).getPropertyValue('--md-outline-variant').trim());
                line.setAttribute('stroke-width', '1.5');
                svg.appendChild(line);
            }
            wrap.appendChild(svg);

            // 中心词
            const posShort = POS_LABEL[current.pos].split(' ')[0];
            const center = mkNode(seed.w, seed.z, posShort, true);
            center.setAttribute('aria-label', '今日词 ' + seed.w + '，' + seed.z + '，播放发音');
            center.style.left = cx + 'px';
            center.style.top = cy + 'px';
            center.addEventListener('click', () => {
                speak(seed.w);
                flashNode(center);
                flashCard();
            });
            wrap.appendChild(center);

            // 发散节点
            fam.forEach((item, i) => {
                const ang = -Math.PI / 2 + (Math.PI * 2 * i) / n;
                const x = cx + r * Math.cos(ang);
                const y = cy + r * Math.sin(ang);
                const node = mkNode(item[0], item[1], null, false);
                node.setAttribute('aria-label', item[0] + '，' + item[1] + '，播放发音');
                node.style.animationDelay = (0.05 * (i + 1)) + 's';
                node.style.left = x + 'px';
                node.style.top = y + 'px';
                node.addEventListener('click', () => {
                    speak(item[0]);
                    flashNode(node);
                });
                wrap.appendChild(node);
            });
        }

        function flashNode(node) {
            node.classList.remove('speaking');
            void node.offsetWidth;
            node.classList.add('speaking');
            setTimeout(() => node.classList.remove('speaking'), 600);
        }

        function flashCard() {
            el.dailyCard.classList.remove('daily--speaking');
            void el.dailyCard.offsetWidth;
            el.dailyCard.classList.add('daily--speaking');
            setTimeout(() => el.dailyCard.classList.remove('daily--speaking'), 600);
        }

        // ================================================
        // 渲染：整页
        // ================================================
        function renderChips(container, list, emptyText) {
            container.innerHTML = '';
            if (!list || list.length === 0) {
                const p = document.createElement('span');
                p.className = 'empty';
                p.textContent = emptyText;
                container.appendChild(p);
                return;
            }
            list.forEach((item) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.innerHTML = '';
                b.appendChild(document.createTextNode(item[0]));
                const s = document.createElement('small');
                s.textContent = item[1];
                b.appendChild(s);
                b.setAttribute('aria-label', item[0] + '，' + item[1] + '，播放发音');
                b.addEventListener('click', () => speak(item[0]));
                container.appendChild(b);
            });
        }

        function renderAll() {
            current = wordForOffset(viewOffset);
            const { seed, pos, date } = current;
            const log = loadLog();
            const key = dateKey(date);
            const isToday = viewOffset === 0;

            // 日期栏
            el.dateText.textContent = (date.getMonth() + 1) + '月' + date.getDate() + '日 ' + WEEK[date.getDay()];
            el.dateSub.textContent = isToday ? '今天 · 词性轮换 名词 → 动词 → 形容词'
                : (viewOffset < 0 ? '正在回顾 ' + Math.abs(viewOffset) + ' 天前' : '正在预览 ' + viewOffset + ' 天后');
            el.segs.forEach(seg => {
                seg.classList.toggle('active', seg.dataset.pos === pos);
                seg.style.background = seg.dataset.pos === pos ? posColor(pos) : '';
            });

            // 词卡
            el.posBadge.textContent = POS_LABEL[pos];
            el.posBadge.style.background = posColorBg(pos);
            el.posBadge.style.color = posColorDark(pos);
            el.wordText.textContent = seed.w;
            el.phoneticText.textContent = seed.p;
            el.zhText.textContent = seed.z;

            // 同词性发散词
            layoutMindMap();

            // 同义 / 反义
            renderChips(el.synChips, seed.s, '暂无');
            renderChips(el.antChips, seed.a, '暂无');

            // 例句
            el.exEn.textContent = seed.e[0];
            el.exZh.textContent = seed.e[1];

            // 打卡
            updateCheckin(log, key);

            // 打卡统计
            el.streakText.textContent = computeStreak(log) + ' 天';
            el.todayBtn.textContent = isToday ? '今天' : '回到今天';

            // 动效重放
            const riseEls = document.querySelectorAll('.rise');
            riseEls.forEach((n) => {
                n.classList.remove('rise');
                void n.offsetWidth;
                n.classList.add('rise');
            });
        }

        function posColor(pos) {
            return getComputedStyle(document.documentElement).getPropertyValue('--pos-' + pos).trim();
        }
        function posColorBg(pos) {
            return getComputedStyle(document.documentElement).getPropertyValue('--pos-' + pos + '-bg').trim();
        }
        function posColorDark(pos) {
            return pos === 'n' ? '#21005D' : (pos === 'v' ? '#003446' : '#3E2700');
        }

        function updateCheckin(log, key) {
            const done = !!log.m[key];
            el.checkinBtn.classList.toggle('done', done);
            const total = totalCheckins(log);
            el.checkinText.textContent = done
                ? '✓ 已打卡 · 累计 ' + total + ' 天'
                : '打卡学习 · 累计 ' + total + ' 天';
        }

        // ================================================
        // 交互
        // ================================================
        function toggleCheckin() {
            const log = loadLog();
            const key = dateKey(current.date);
            if (log.m[key]) delete log.m[key];
            else log.m[key] = current.seed.w;
            saveLog(log);
            updateCheckin(log, key);
            const streak = computeStreak(log);
            el.streakText.textContent = streak + ' 天';
            if (streak > 0) {
                el.streakPill.style.animation = 'none';
                void el.streakPill.offsetWidth;
                el.streakPill.style.animation = 'rise 0.4s ease';
            }
        }

        function goDay(offset) {
            viewOffset = Math.max(-4000, Math.min(offset, 4000));
            renderAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        el.checkinBtn.addEventListener('click', toggleCheckin);
        el.prevDay.addEventListener('click', () => goDay(viewOffset - 1));
        el.nextDay.addEventListener('click', () => goDay(viewOffset + 1));
        el.todayBtn.addEventListener('click', () => goDay(0));
        el.phoneticBtn.addEventListener('click', () => {
            speak(current.seed.w);
            flashCard();
        });
        el.exSay.addEventListener('click', () => speak(current.seed.e[0]));

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft') goDay(viewOffset - 1);
            else if (e.key === 'ArrowRight') goDay(viewOffset + 1);
            else if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
                e.preventDefault();
                speak(current.seed.w);
                flashCard();
            }
        });

        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { if (current) layoutMindMap(); }, 150);
        });

        // ================================================
        // 启动
        // ================================================
        renderAll();
    </script>
</body>
</html>
