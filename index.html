<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS单词卡片</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,0&display=swap" rel="stylesheet">
    <style>
        /* ========================================
           Material Design 3 — Design Tokens
           ======================================== */

        :root {
            /* Color — Light scheme (seed: #6750A4) */
            --md-primary: #6750A4;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #EADDFF;
            --md-on-primary-container: #21005D;

            --md-secondary: #625B71;
            --md-on-secondary: #FFFFFF;
            --md-secondary-container: #E8DEF8;
            --md-on-secondary-container: #1D192B;

            --md-tertiary: #7D5260;
            --md-on-tertiary: #FFFFFF;
            --md-tertiary-container: #FFD8E4;
            --md-on-tertiary-container: #31111D;

            --md-error: #B3261E;
            --md-on-error: #FFFFFF;
            --md-error-container: #F9DEDC;
            --md-on-error-container: #410E0B;

            --md-background: #FFFBFE;
            --md-on-background: #1C1B1F;
            --md-surface: #FFFBFE;
            --md-on-surface: #1C1B1F;
            --md-surface-variant: #E7E0EC;
            --md-on-surface-variant: #49454F;

            --md-outline: #79747E;
            --md-outline-variant: #CAC4D0;
            --md-shadow: #000000;

            /* Shape */
            --md-shape-xs: 4px;
            --md-shape-sm: 8px;
            --md-shape-md: 12px;
            --md-shape-lg: 16px;
            --md-shape-xl: 28px;
            --md-shape-full: 9999px;

            /* Elevation */
            --md-elevation-0: none;
            --md-elevation-1: 0px 1px 3px 1px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.30);
            --md-elevation-2: 0px 2px 6px 2px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.30);
            --md-elevation-3: 0px 4px 8px 3px rgba(0,0,0,0.15), 0px 1px 3px 0px rgba(0,0,0,0.30);

            /* Motion */
            --md-motion-emphasized: cubic-bezier(0.2, 0.0, 0, 1.0);
            --md-motion-emphasized-decel: cubic-bezier(0.05, 0.7, 0.1, 1.0);
            --md-motion-emphasized-accel: cubic-bezier(0.3, 0.0, 0.8, 0.15);
        }

        /* ========================================
           Reset & Base
           ======================================== */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--md-background);
            color: var(--md-on-background);
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            display: none;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100%;
        }

        /* ========================================
           Material 3 — Top App Bar (Small)
           ======================================== */

        .top-app-bar {
            display: flex;
            flex-direction: column;
            background: var(--md-surface);
            box-shadow: var(--md-elevation-1);
            z-index: 10;
            position: relative;
        }

        .top-app-bar__row {
            display: flex;
            align-items: center;
            height: 64px;
            padding: 0 24px;
        }

        .top-app-bar__title {
            font-size: 22px;
            font-weight: 500;
            line-height: 28px;
            letter-spacing: 0;
            color: var(--md-on-surface);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .top-app-bar__action {
            position: relative;
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            border-radius: var(--md-shape-full);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--md-on-surface-variant);
            overflow: hidden;
            transition: background 0.15s ease;
            flex-shrink: 0;
        }

        .top-app-bar__action:hover {
            background: rgba(73, 69, 79, 0.08);
        }

        .top-app-bar__action:active {
            background: rgba(73, 69, 79, 0.12);
        }

        .top-app-bar__action .material-symbols-outlined {
            font-size: 24px;
        }

        /* ========================================
           Material 3 — Linear Progress Indicator
           ======================================== */

        .progress-track {
            width: 100%;
            height: 4px;
            background: var(--md-surface-variant);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--md-primary);
            transition: width 0.3s var(--md-motion-emphasized);
            border-radius: 0 2px 2px 0;
        }

        /* ========================================
           Card Container & Material 3 Elevated Card
           ======================================== */

        .card-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            perspective: 1000px;
            position: relative;
        }

        .word-card {
            width: 100%;
            max-width: 360px;
            height: 420px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s var(--md-motion-emphasized);
            cursor: pointer;
            touch-action: none;
        }

        button:focus-visible,
        .word-card:focus-visible,
        .phonetic:focus-visible {
            outline: 3px solid var(--md-primary);
            outline-offset: 3px;
        }

        .word-card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: var(--md-shape-lg);
            background: var(--md-surface);
            box-shadow: var(--md-elevation-1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 28px;
        }

        .card-back {
            transform: rotateY(180deg);
            background: var(--md-surface);
        }

        .card-face .word {
            font-size: 28px;
            font-weight: 600;
            line-height: 36px;
            letter-spacing: 0;
            color: var(--md-on-surface);
            text-align: center;
            margin-bottom: 20px;
        }

        .card-face .phonetic {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            letter-spacing: 0.1px;
            color: var(--md-on-surface-variant);
            background: var(--md-surface-variant);
            border: none;
            padding: 6px 14px 6px 16px;
            border-radius: var(--md-shape-full);
            cursor: pointer;
            transition: background 0.15s ease;
            font-family: 'Times New Roman', Georgia, serif;
        }

        .card-face .phonetic:hover {
            background: var(--md-outline-variant);
        }

        .card-face .phonetic:active {
            background: var(--md-outline);
            color: var(--md-surface);
        }

        .card-face .phonetic .material-symbols-outlined {
            font-size: 18px;
        }

        .card-face .part-of-speech {
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            letter-spacing: 0.1px;
            color: var(--md-primary);
            background: var(--md-primary-container);
            padding: 2px 14px;
            border-radius: var(--md-shape-full);
            margin-bottom: 16px;
        }

        .card-face .definition {
            font-size: 18px;
            font-weight: 500;
            line-height: 28px;
            letter-spacing: 0;
            color: var(--md-on-surface);
            text-align: center;
            max-width: 100%;
        }

        .card-face .hint {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            font-weight: 400;
            line-height: 16px;
            letter-spacing: 0.5px;
            color: var(--md-on-surface-variant);
            opacity: 0.6;
        }

        /* ========================================
           Material 3 — Icon Buttons (Navigation)
           ======================================== */

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
            padding: 16px 24px 28px;
            z-index: 10;
        }

        .icon-btn {
            position: relative;
            width: 56px;
            height: 56px;
            border: none;
            background: transparent;
            border-radius: var(--md-shape-full);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--md-on-surface-variant);
            overflow: hidden;
            transition: background 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .icon-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: currentColor;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .icon-btn:hover::before {
            opacity: 0.08;
        }

        .icon-btn:active::before {
            opacity: 0.12;
        }

        .icon-btn .material-symbols-outlined {
            font-size: 28px;
            position: relative;
            z-index: 1;
        }

        /* ========================================
           Material 3 — Filled Button
           ======================================== */

        .filled-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            padding: 0 24px;
            border: none;
            border-radius: var(--md-shape-full);
            background: var(--md-primary);
            color: var(--md-on-primary);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            letter-spacing: 0.1px;
            cursor: pointer;
            overflow: hidden;
            transition: box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .filled-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--md-on-primary);
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .filled-btn:hover::before {
            opacity: 0.08;
        }

        .filled-btn:active::before {
            opacity: 0.12;
        }

        .filled-btn .material-symbols-outlined {
            font-size: 18px;
        }

        /* ========================================
           Swipe Hint (Snackbar-like)
           ======================================== */

        .swipe-hint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--md-surface);
            color: var(--md-on-surface);
            padding: 10px 24px;
            border-radius: var(--md-shape-sm);
            font-size: 14px;
            font-weight: 400;
            line-height: 20px;
            letter-spacing: 0.25px;
            box-shadow: var(--md-elevation-2);
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s var(--md-motion-emphasized-decel);
            pointer-events: none;
            z-index: 20;
            white-space: nowrap;
        }

        .swipe-hint.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========================================
           Unit Indicator
           ======================================== */

        .unit-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 36px;
            font-weight: 600;
            line-height: 44px;
            letter-spacing: 0;
            color: var(--md-primary);
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            text-shadow: none;
        }

        .unit-indicator.show {
            animation: unitPop 0.6s var(--md-motion-emphasized) forwards;
        }

        @keyframes unitPop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            40% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.05);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* ========================================
           Loading Screen
           ======================================== */

        .loading {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background: var(--md-background);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--md-outline-variant);
            border-top-color: var(--md-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-title {
            font-size: 16px;
            font-weight: 500;
            line-height: 24px;
            letter-spacing: 0.15px;
            color: var(--md-on-surface);
            margin-bottom: 4px;
        }

        .loading-sub {
            font-size: 14px;
            font-weight: 400;
            line-height: 20px;
            letter-spacing: 0.25px;
            color: var(--md-on-surface-variant);
        }

        .loading-error {
            display: none;
            margin-top: 32px;
        }

        .loading-error .material-symbols-outlined {
            font-size: 48px;
            color: var(--md-error);
            margin-bottom: 16px;
        }

        .loading-error .filled-btn {
            margin-top: 24px;
        }

        /* ========================================
           Unit Picker — Material 3 Bottom Sheet
           ======================================== */

        .scrim {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.32);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s var(--md-motion-emphasized);
            z-index: 100;
        }

        .scrim.show {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 101;
            display: flex;
            flex-direction: column;
            max-height: 78dvh;
            background: var(--md-surface);
            border-radius: var(--md-shape-xl) var(--md-shape-xl) 0 0;
            box-shadow: var(--md-elevation-3);
            transform: translateY(105%);
            visibility: hidden;
            transition: transform 0.32s var(--md-motion-emphasized-decel), visibility 0s linear 0.32s;
            -webkit-tap-highlight-color: transparent;
        }

        .bottom-sheet.show {
            visibility: visible;
            transform: translateY(0);
            transition: transform 0.32s var(--md-motion-emphasized-decel);
        }

        .bottom-sheet__handle {
            width: 32px;
            height: 4px;
            border-radius: var(--md-shape-full);
            background: var(--md-outline-variant);
            margin: 12px auto 4px;
            flex-shrink: 0;
        }

        .bottom-sheet__header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 8px 24px 16px;
        }

        .bottom-sheet__title {
            font-size: 18px;
            font-weight: 500;
            line-height: 24px;
            letter-spacing: 0.15px;
            color: var(--md-on-surface);
            flex-shrink: 0;
        }

        .bottom-sheet__subtitle {
            font-size: 12px;
            font-weight: 400;
            line-height: 16px;
            letter-spacing: 0.4px;
            color: var(--md-on-surface-variant);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .unit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
            gap: 10px;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 4px 24px calc(24px + env(safe-area-inset-bottom));
            overflow-y: auto;
            overscroll-behavior: contain;
            flex: 1 1 auto;
            min-height: 0;
        }

        .unit-chip {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 6px 8px;
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--md-shape-md);
            background: var(--md-surface);
            color: var(--md-on-surface-variant);
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .unit-chip:hover {
            background: var(--md-surface-variant);
        }

        .unit-chip:active {
            background: var(--md-outline-variant);
        }

        .unit-chip:focus-visible {
            outline: 3px solid var(--md-primary);
            outline-offset: 2px;
        }

        .unit-chip.active {
            background: var(--md-primary-container);
            border-color: transparent;
            color: var(--md-on-primary-container);
        }

        .unit-chip__num {
            font-size: 15px;
            font-weight: 600;
            line-height: 20px;
            letter-spacing: 0.1px;
        }

        .unit-chip__bar {
            width: 100%;
            height: 3px;
            border-radius: var(--md-shape-full);
            background: var(--md-surface-variant);
            overflow: hidden;
        }

        .unit-chip.active .unit-chip__bar {
            background: rgba(33, 0, 93, 0.15);
        }

        .unit-chip__fill {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: var(--md-shape-full);
            background: var(--md-primary);
            transition: width 0.3s var(--md-motion-emphasized);
        }

        .unit-chip__meta {
            font-size: 10px;
            font-weight: 400;
            line-height: 14px;
            letter-spacing: 0.4px;
            opacity: 0.85;
        }

        /* ========================================
           Responsive
           ======================================== */

        @media (max-width: 420px) {
            .word-card {
                max-width: 100%;
                height: 380px;
            }

            .card-face {
                padding: 24px 20px;
            }

            .card-face .word {
                font-size: 24px;
                line-height: 32px;
            }

            .card-face .definition {
                font-size: 16px;
                line-height: 24px;
            }

            .top-app-bar__row {
                padding: 0 16px;
            }

            .controls {
                gap: 24px;
                padding: 12px 16px 20px;
            }

            .icon-btn {
                width: 48px;
                height: 48px;
            }

            .icon-btn .material-symbols-outlined {
                font-size: 24px;
            }

            .bottom-sheet__header {
                padding: 8px 16px 12px;
            }

            .unit-grid {
                padding: 4px 16px calc(20px + env(safe-area-inset-bottom));
                gap: 8px;
            }

            .unit-chip {
                padding: 8px 4px 6px;
            }
        }

        @media (min-width: 600px) {
            .word-card {
                max-width: 400px;
                height: 460px;
            }

            .card-face .word {
                font-size: 32px;
                line-height: 40px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- ======== Loading Screen ======== -->
    <div class="loading" id="loadingContainer">
        <div class="spinner"></div>
        <p class="loading-title">正在加载词汇文件</p>
        <p class="loading-sub" id="loadingSubtext">IELTS Word List.txt</p>
        <div class="loading-error" id="errorContainer">
            <span class="material-symbols-outlined">error_outline</span>
            <p class="loading-title">加载失败</p>
            <p class="loading-sub">请确保文件存在于服务器根目录</p>
            <button class="filled-btn" id="useSampleBtn">
                <span class="material-symbols-outlined">auto_stories</span>
                使用示例数据
            </button>
        </div>
    </div>

    <!-- ======== Main App ======== -->
    <div class="app" id="container">
        <header class="top-app-bar">
            <div class="top-app-bar__row">
                <h1 class="top-app-bar__title" id="unitTitle">未加载单元</h1>
                <button type="button" class="top-app-bar__action" id="unitPickerBtn" aria-label="选择单元">
                    <span class="material-symbols-outlined">grid_view</span>
                </button>
                <button type="button" class="top-app-bar__action" id="playBtn" aria-label="播放发音">
                    <span class="material-symbols-outlined">volume_up</span>
                </button>
            </div>
            <div class="progress-track">
                <div class="progress-bar" id="progressFill" style="width: 0%"></div>
            </div>
        </header>

        <div class="card-container" id="cardContainer">
            <div class="word-card" id="wordCard" role="button" tabindex="0" aria-label="单词卡片，点击翻面">
                <div class="card-face card-front">
                    <p class="word" id="wordText">-</p>
                    <button type="button" class="phonetic" id="phoneticButton" aria-label="播放当前单词发音">
                        <span class="material-symbols-outlined">volume_up</span>
                        <span id="phoneticText">-</span>
                    </button>
                    <span class="hint">点击卡片查看释义</span>
                </div>
                <div class="card-face card-back">
                    <span class="part-of-speech" id="partOfSpeech">-</span>
                    <p class="definition" id="definitionText">-</p>
                    <span class="hint">点击卡片返回</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button type="button" class="icon-btn" id="prevBtn" aria-label="上一个单词">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>
            <button type="button" class="icon-btn" id="nextBtn" aria-label="下一个单词">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </div>

        <div class="swipe-hint" id="swipeHint" role="status" aria-live="polite"></div>
        <div class="unit-indicator" id="unitIndicator"></div>
    </div>

    <!-- ======== Unit Picker Bottom Sheet ======== -->
    <div class="scrim" id="scrim"></div>
    <aside class="bottom-sheet" id="unitSheet" role="dialog" aria-modal="true" aria-label="单元选择">
        <div class="bottom-sheet__handle" aria-hidden="true"></div>
        <div class="bottom-sheet__header">
            <h2 class="bottom-sheet__title">选择单元</h2>
            <p class="bottom-sheet__subtitle" id="unitSheetSubtitle"></p>
        </div>
        <div class="unit-grid" id="unitGrid"></div>
    </aside>

    <script>
        // ============================================
        // Data & State
        // ============================================

        let wordLists = [];
        let currentUnitIndex = 0;
        let currentWordIndex = 0;
        let isFlipped = false;
        let unitProgress = {};
        let sheetOpen = false;
        const STORAGE_KEY = 'ielts-word-cards-progress-v1';

        const sampleWordLists = [
            {
                id: 'wordlist01',
                name: 'Word List 01',
                words: [
                    { word: 'emperor', phonetic: '/ˈempərə(r)/', partOfSpeech: 'n.', definition: '皇帝；君主' },
                    { word: 'exact', phonetic: '/ɪgˈzækt/', partOfSpeech: 'a.', definition: '精确的；准确的' },
                    { word: 'traditional', phonetic: '[trəˈdɪʃənl]', partOfSpeech: 'a.', definition: '传统的，惯例的；口传的，传说的' },
                    { word: 'lack', phonetic: '/læk/', partOfSpeech: 'n./vt.', definition: '缺乏，不足，没有' },
                    { word: 'pardon', phonetic: '/ˈpɑːdn/', partOfSpeech: 'excl./n./vt.', definition: '原谅，宽恕；赦免' }
                ]
            },
            {
                id: 'wordlist02',
                name: 'Word List 02',
                words: [
                    { word: 'regional', phonetic: "['rɪːdʒənl]", partOfSpeech: 'a.', definition: '局部范围的；地方（性）的，区域性的' },
                    { word: 'secure', phonetic: '/sɪˈkjuə(r)/', partOfSpeech: 'v./a.', definition: '得到某物，获得；防护，保卫  a. 安全的；可靠的，放心的' },
                    { word: 'preserve', phonetic: '/prɪˈzɜːv/', partOfSpeech: 'vt.', definition: '保护；维持；保存，保藏；腌渍' }
                ]
            }
        ];

        // ============================================
        // DOM References
        // ============================================

        const loadingContainerEl = document.getElementById('loadingContainer');
        const containerEl = document.getElementById('container');
        const errorContainerEl = document.getElementById('errorContainer');
        const useSampleBtnEl = document.getElementById('useSampleBtn');
        const wordCardEl = document.getElementById('wordCard');
        const wordTextEl = document.getElementById('wordText');
        const phoneticTextEl = document.getElementById('phoneticText');
        const phoneticButtonEl = document.getElementById('phoneticButton');
        const partOfSpeechEl = document.getElementById('partOfSpeech');
        const definitionTextEl = document.getElementById('definitionText');
        const unitTitleEl = document.getElementById('unitTitle');
        const progressFillEl = document.getElementById('progressFill');
        const prevBtnEl = document.getElementById('prevBtn');
        const nextBtnEl = document.getElementById('nextBtn');
        const playBtnEl = document.getElementById('playBtn');
        const unitPickerBtnEl = document.getElementById('unitPickerBtn');
        const scrimEl = document.getElementById('scrim');
        const unitSheetEl = document.getElementById('unitSheet');
        const unitGridEl = document.getElementById('unitGrid');
        const unitSheetSubtitleEl = document.getElementById('unitSheetSubtitle');
        const swipeHintEl = document.getElementById('swipeHint');
        const unitIndicatorEl = document.getElementById('unitIndicator');

        // ============================================
        // Word Data Parser
        // ============================================

        function parseWordData(text) {
            const lines = text.replace(/\r/g, '').split('\n');
            const lists = [];
            let currentList = null;

            for (let line of lines) {
                line = line.trim();
                const unitMatch = line.match(/^Word List\s*0?(\d+)/i);
                if (unitMatch) {
                    if (currentList) lists.push(currentList);
                    currentList = {
                        id: `wordlist${unitMatch[1].padStart(2, '0')}`,
                        name: `Word List ${unitMatch[1].padStart(2, '0')}`,
                        words: []
                    };
                    continue;
                }
                if (!currentList || !line) continue;
                const phoneticPattern = String.raw`(?:\/[^/]+\/|\[[^\]]+\]|\{[^}]+\})`;
                const partOfSpeechPattern = String.raw`(?:n|v|vt|vi|a|ad|adv|prep|conj|pron|num|excl|int)`;
                const match =
                    line.match(new RegExp(`^(.+?)\\s+(${phoneticPattern}(?:\\s*;\\s*${phoneticPattern})*)\\s+(.+)$`)) ||
                    line.match(new RegExp(`^(.+?)\\s+([/\\[{].*?)\\s+(${partOfSpeechPattern}\\..*)$`, 'i'));
                if (match) {
                    const word = match[1].trim().replace(/\*$/, '');
                    const phonetic = match[2].trim();
                    const definition = match[3].trim();
                    const defMatch = definition.match(new RegExp(`^(${partOfSpeechPattern}\\.(?:/${partOfSpeechPattern}\\.)*)\\s*`, 'i'));
                    const partOfSpeech = defMatch ? defMatch[1] : '';
                    const defText = defMatch ? definition.slice(defMatch[0].length) : definition;
                    currentList.words.push({ word, phonetic, partOfSpeech, definition: defText });
                }
            }
            if (currentList) lists.push(currentList);
            return lists.filter(list => list.words.length > 0);
        }

        // ============================================
        // App Lifecycle
        // ============================================

        function loadWordFile() {
            fetch('word-list.txt')
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(text => {
                    wordLists = parseWordData(text);
                    wordLists.length > 0 ? startApp() : showError();
                })
                .catch(() => showError());
        }

        function showError() {
            document.getElementById('loadingSubtext').style.display = 'none';
            errorContainerEl.style.display = 'block';
        }

        function startApp() {
            if (wordLists.length === 0) return;
            loadingContainerEl.style.display = 'none';
            containerEl.style.display = 'flex';
            restoreProgress();
            renderUnitGrid();
            updateCard();
            setupGestureControls();
        }

        function sanitizeUnitProgress(map) {
            const out = {};
            for (const key of Object.keys(map)) {
                const i = Number(key);
                if (!Number.isInteger(i) || i < 0 || i >= wordLists.length) continue;
                const w = Number(map[key]);
                out[i] = Number.isInteger(w) && w >= 0 ? Math.min(w, wordLists[i].words.length - 1) : 0;
            }
            return out;
        }

        function restoreProgress() {
            let saved = null;
            try {
                saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
            } catch {
                saved = null;
            }
            // Always start from a clean slate so a repeated startApp() (e.g. the
            // sample-data fallback) or corrupt storage can never leak stale state.
            unitProgress = {};
            let targetUnit = 0;
            if (saved && typeof saved === 'object') {
                if (saved.unitProgress && typeof saved.unitProgress === 'object') {
                    // New per-unit format: { unitProgress: { [unitIndex]: wordIndex }, lastUnit }
                    unitProgress = sanitizeUnitProgress(saved.unitProgress);
                    const lu = Number(saved.lastUnit);
                    targetUnit = Number.isInteger(lu) && lu >= 0 ? clampUnit(lu) : 0;
                } else if (Number.isInteger(Number(saved.unit))) {
                    // Legacy { unit, word } format → migrate to per-unit map
                    const u = clampUnit(Number(saved.unit) || 0);
                    const w = Number(saved.word);
                    unitProgress = {
                        [u]: Number.isInteger(w) && w > 0 ? Math.min(w, wordLists[u].words.length - 1) : 0
                    };
                    targetUnit = u;
                }
            }
            currentUnitIndex = Number.isInteger(targetUnit) && targetUnit >= 0 && targetUnit < wordLists.length
                ? targetUnit
                : 0;
            currentWordIndex = unitProgress[currentUnitIndex] ?? 0;
            currentWordIndex = Math.min(currentWordIndex, wordLists[currentUnitIndex].words.length - 1);
        }

        function saveProgress() {
            try {
                unitProgress[currentUnitIndex] = currentWordIndex;
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    unitProgress,
                    lastUnit: currentUnitIndex
                }));
            } catch {
                // Storage may be unavailable in private or restricted browsing modes.
            }
        }

        // ============================================
        // Card UI
        // ============================================

        function updateCard() {
            if (wordLists.length === 0) return;
            const list = wordLists[currentUnitIndex];
            if (!list || !list.words.length) return;
            const w = list.words[currentWordIndex];
            wordTextEl.textContent = w.word;
            phoneticTextEl.textContent = w.phonetic;
            partOfSpeechEl.textContent = w.partOfSpeech;
            definitionTextEl.textContent = w.definition;
            unitTitleEl.textContent = `${list.name} · ${currentWordIndex + 1}/${list.words.length}`;
            progressFillEl.style.width = ((currentWordIndex + 1) / list.words.length * 100) + '%';
            progressFillEl.parentElement.setAttribute('aria-label', `学习进度 ${currentWordIndex + 1}/${list.words.length}`);
            progressFillEl.parentElement.setAttribute('role', 'progressbar');
            progressFillEl.parentElement.setAttribute('aria-valuemin', '1');
            progressFillEl.parentElement.setAttribute('aria-valuemax', String(list.words.length));
            progressFillEl.parentElement.setAttribute('aria-valuenow', String(currentWordIndex + 1));
            wordCardEl.classList.remove('flipped');
            wordCardEl.setAttribute('aria-pressed', 'false');
            isFlipped = false;
            saveProgress();
        }

        function toggleCard() {
            wordCardEl.classList.toggle('flipped');
            isFlipped = !isFlipped;
            wordCardEl.setAttribute('aria-pressed', String(isFlipped));
        }

        function playPronunciation() {
            if (!wordLists.length) return;
            const word = wordLists[currentUnitIndex].words[currentWordIndex].word;
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(word);
                u.lang = 'en-US';
                u.rate = 0.8;
                speechSynthesis.speak(u);
            }
        }

        function showSwipeHint(msg) {
            swipeHintEl.textContent = msg;
            swipeHintEl.classList.add('show');
            setTimeout(() => swipeHintEl.classList.remove('show'), 1500);
        }

        function showUnitIndicator() {
            unitIndicatorEl.textContent = `Unit ${currentUnitIndex + 1}`;
            unitIndicatorEl.classList.remove('show');
            void unitIndicatorEl.offsetWidth;
            unitIndicatorEl.classList.add('show');
            setTimeout(() => unitIndicatorEl.classList.remove('show'), 600);
        }

        // ============================================
        // Navigation
        // ============================================

        function nextWord() {
            if (!wordLists.length) return;
            currentWordIndex = (currentWordIndex + 1) % wordLists[currentUnitIndex].words.length;
            updateCard();
        }

        function prevWord() {
            if (!wordLists.length) return;
            const len = wordLists[currentUnitIndex].words.length;
            currentWordIndex = (currentWordIndex - 1 + len) % len;
            updateCard();
        }

        function clampUnit(index) {
            return Math.min(Math.max(index, 0), wordLists.length - 1);
        }

        function goToUnit(index) {
            if (!wordLists.length || wordLists.length < 2) return;
            const target = clampUnit(index);
            if (target === currentUnitIndex) return;
            unitProgress[currentUnitIndex] = currentWordIndex;
            currentUnitIndex = target;
            currentWordIndex = unitProgress[target] ?? 0;
            currentWordIndex = Math.min(currentWordIndex, wordLists[currentUnitIndex].words.length - 1);
            updateCard();
            showUnitIndicator();
            showSwipeHint(`切换到 ${wordLists[currentUnitIndex].name}`);
        }

        function nextUnit() {
            if (!wordLists.length || wordLists.length < 2) return;
            goToUnit((currentUnitIndex + 1) % wordLists.length);
        }

        function prevUnit() {
            if (!wordLists.length || wordLists.length < 2) return;
            goToUnit((currentUnitIndex - 1 + wordLists.length) % wordLists.length);
        }

        // ============================================
        // Unit Picker — Bottom Sheet
        // ============================================

        function renderUnitGrid() {
            unitGridEl.innerHTML = '';
            wordLists.forEach((list, i) => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'unit-chip';
                chip.dataset.index = String(i);

                const num = document.createElement('span');
                num.className = 'unit-chip__num';
                num.textContent = String(i + 1).padStart(2, '0');

                const bar = document.createElement('span');
                bar.className = 'unit-chip__bar';
                const fill = document.createElement('span');
                fill.className = 'unit-chip__fill';
                bar.appendChild(fill);

                const meta = document.createElement('span');
                meta.className = 'unit-chip__meta';

                chip.append(num, bar, meta);
                chip.addEventListener('click', () => {
                    goToUnit(i);
                    closeUnitSheet();
                });
                unitGridEl.appendChild(chip);
            });
            unitSheetSubtitleEl.textContent = `共 ${wordLists.length} 个单元 · 点击跳转，返回时自动恢复该单元进度`;
        }

        function refreshUnitGrid() {
            const chips = unitGridEl.querySelectorAll('.unit-chip');
            wordLists.forEach((list, i) => {
                const chip = chips[i];
                if (!chip) return;
                const total = list.words.length;
                // `i in unitProgress` separates "visited (even at word 0)" from "never opened".
                const pos = i in unitProgress ? Math.min((unitProgress[i] ?? 0) + 1, total) : 0;
                chip.querySelector('.unit-chip__meta').textContent = `${pos}/${total}`;
                chip.querySelector('.unit-chip__fill').style.width = `${pos / total * 100}%`;
                chip.classList.toggle('active', i === currentUnitIndex);
                chip.setAttribute('aria-label', `${list.name}，进度 ${pos}/${total}`);
            });
        }

        function openUnitSheet() {
            if (!wordLists.length) return;
            refreshUnitGrid();
            scrimEl.classList.add('show');
            unitSheetEl.classList.add('show');
            sheetOpen = true;
            containerEl.setAttribute('aria-hidden', 'true');
            const active = unitGridEl.querySelector('.unit-chip.active') || unitGridEl.querySelector('.unit-chip');
            if (active) active.focus();
        }

        function closeUnitSheet() {
            scrimEl.classList.remove('show');
            unitSheetEl.classList.remove('show');
            sheetOpen = false;
            containerEl.removeAttribute('aria-hidden');
            unitPickerBtnEl.focus();
        }

        function moveUnitGridFocus(key) {
            const chips = Array.from(unitGridEl.querySelectorAll('.unit-chip'));
            if (!chips.length) return;
            const cur = Math.max(chips.indexOf(document.activeElement), 0);
            const cols = getComputedStyle(unitGridEl).gridTemplateColumns.split(' ').length || 4;
            let next = cur;
            if (key === 'ArrowRight') next = (cur + 1) % chips.length;
            else if (key === 'ArrowLeft') next = (cur - 1 + chips.length) % chips.length;
            else if (key === 'ArrowDown') next = Math.min(cur + cols, chips.length - 1);
            else if (key === 'ArrowUp') next = Math.max(cur - cols, 0);
            chips[next].focus();
        }

        // ============================================
        // Gesture & Keyboard Controls
        // ============================================

        function setupGestureControls() {
            let pointerStart = null;
            let suppressClick = false;

            wordCardEl.addEventListener('pointerdown', (e) => {
                pointerStart = { x: e.clientX, y: e.clientY };
            });
            wordCardEl.addEventListener('pointerup', (e) => {
                if (!pointerStart) return;
                const dx = e.clientX - pointerStart.x;
                const dy = e.clientY - pointerStart.y;
                pointerStart = null;
                if (Math.max(Math.abs(dx), Math.abs(dy)) < 45) return;
                suppressClick = true;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (!isFlipped) dx < 0 ? nextWord() : prevWord();
                } else {
                    dy < 0 ? nextUnit() : prevUnit();
                }
            });
            wordCardEl.addEventListener('pointercancel', () => { pointerStart = null; });
            wordCardEl.addEventListener('click', () => {
                if (suppressClick) {
                    suppressClick = false;
                    return;
                }
                toggleCard();
            });

            phoneticButtonEl.addEventListener('click', (e) => {
                e.stopPropagation();
                playPronunciation();
            });

            prevBtnEl.addEventListener('click', prevWord);
            nextBtnEl.addEventListener('click', nextWord);
            playBtnEl.addEventListener('click', playPronunciation);

            unitPickerBtnEl.addEventListener('click', () => {
                if (sheetOpen) {
                    closeUnitSheet();
                } else {
                    openUnitSheet();
                }
            });
            scrimEl.addEventListener('click', closeUnitSheet);

            document.addEventListener('keydown', (e) => {
                if (sheetOpen) {
                    if (e.key === 'Escape') { e.preventDefault(); closeUnitSheet(); }
                    else if (e.key.startsWith('Arrow')) { e.preventDefault(); moveUnitGridFocus(e.key); }
                    return;
                }
                if (e.key === 'ArrowLeft') prevWord();
                if (e.key === 'ArrowRight') nextWord();
                if (e.key === 'ArrowUp') prevUnit();
                if (e.key === 'ArrowDown') nextUnit();
                if (e.key === ' ') { e.preventDefault(); toggleCard(); }
                if (e.key === 'Enter' && document.activeElement === wordCardEl) toggleCard();
                if (e.key === 'p' || e.key === 'P') playPronunciation();
            });
        }

        // ============================================
        // Boot
        // ============================================

        useSampleBtnEl.addEventListener('click', () => { wordLists = sampleWordLists; startApp(); });
        window.addEventListener('DOMContentLoaded', loadWordFile);
    </script>
</body>
</html>
